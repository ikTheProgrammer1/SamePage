<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SamePage</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div class="max-w-3xl mx-auto p-6">
      <header class="mb-6">
        <h1 class="text-2xl font-semibold">SamePage</h1>
        <p class="text-slate-600">Get on the same page after a conversation.</p>
      </header>
      {% block content %}{% endblock %}
      <footer class="mt-10 text-xs text-slate-500">
        <p>
          Anonymous by default. Sessions delete after 24h. Built for the Cloud Run Hackathon.
        </p>
      </footer>
    </div>
  </body>
  </html>
