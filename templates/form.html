{% extends "base.html" %}
{% block content %}
<form method="post" action="/submit" class="space-y-4">
  <input type="hidden" name="session" value="{{ session }}" />
  <input type="hidden" name="token" value="{{ token }}" />

  <h2 class="text-xl font-medium">Partner {{ who }}</h2>

  <label class="block">
    <span class="text-sm text-slate-700">Key takeaway (1–2 sentences)</span>
    <textarea name="takeaway" required class="mt-1 w-full border rounded p-2" rows="3"></textarea>
  </label>

  <label class="block">
    <span class="text-sm text-slate-700">Request / Next step (who/what/when)</span>
    <textarea name="req_text" required class="mt-1 w-full border rounded p-2" rows="3"></textarea>
  </label>

  <label class="block">
    <span class="text-sm text-slate-700">Tone (one word)</span>
    <input name="tone" required class="mt-1 w-full border rounded p-2" placeholder="e.g., relieved, stressed, calm" />
  </label>

  <label class="flex items-center gap-2 text-sm text-slate-700">
    <input type="checkbox" name="consent" />
    <span>I consent to store this session up to 24h to show results.</span>
  </label>

  <div class="pt-2">
    <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Submit</button>
  </div>
</form>
{% endblock %}
