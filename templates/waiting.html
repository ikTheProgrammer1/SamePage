{% extends "base.html" %}
{% block content %}
<div class="space-y-4" aria-live="polite" aria-busy="true">
  <h2 class="text-xl font-medium">Waiting for partner…</h2>
  <p class="text-slate-600 dark:text-slate-300">We’ll compute your alignment as soon as both submissions are in.</p>

  <!-- Animated dots -->
  <div class="flex items-center gap-2 text-slate-600">
    <span class="w-2 h-2 rounded-full bg-slate-400 animate-bounce" style="animation-delay:0ms"></span>
    <span class="w-2 h-2 rounded-full bg-slate-400 animate-bounce" style="animation-delay:150ms"></span>
    <span class="w-2 h-2 rounded-full bg-slate-400 animate-bounce" style="animation-delay:300ms"></span>
  </div>

  <!-- Step progress (visual only) -->
  <div class="grid grid-cols-3 gap-2 text-xs">
    <div class="rounded border dark:border-slate-700 p-2 text-center" id="step-1">1) Save</div>
    <div class="rounded border dark:border-slate-700 p-2 text-center" id="step-2">2) Score</div>
    <div class="rounded border dark:border-slate-700 p-2 text-center" id="step-3">3) Explain</div>
  </div>

  <p class="text-xs text-slate-500 dark:text-slate-400">Session: {{ session }}</p>
</div>

<!-- Toast: results ready -->
<div id="toast" class="fixed bottom-6 right-6 z-50 hidden opacity-0 translate-y-3 transition-all duration-300">
  <div class="rounded-lg border dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 shadow-lg px-4 py-3">
    <div class="font-medium">Results ready</div>
    <div class="text-xs text-slate-600 dark:text-slate-300">Opening alignment card…</div>
  </div>
  <span class="sr-only" aria-live="polite">Results ready. Opening alignment card.</span>
  </div>

<script>
  // Cycle highlight across steps for a sense of progress
  (function(){
    const ids=['step-1','step-2','step-3']; let i=0;
    const tick=()=>{
      ids.forEach((id,idx)=>{
        const el=document.getElementById(id); if(!el) return;
        if(idx===i){ el.classList.add('border-blue-600','bg-blue-50','dark:bg-blue-900'); }
        else { el.classList.remove('border-blue-600','bg-blue-50','dark:bg-blue-900'); }
      });
      i=(i+1)%ids.length;
    };
    tick(); setInterval(tick, 900);
  })();
  // Poll for completion and redirect both partners when ready
  (function(){
    const session = '{{ session }}';
    let intId;
    const showToast = () => {
      const t = document.getElementById('toast');
      if (!t) return;
      t.classList.remove('hidden');
      requestAnimationFrame(()=>{
        t.classList.remove('opacity-0','translate-y-3');
      });
    };
    const poll = async () => {
      try {
        const r = await fetch(`/api/session/${session}`, { cache: 'no-store' });
        if (!r.ok) return;
        const j = await r.json();
        if (j && j.status === 'completed') {
          try { clearInterval(intId); } catch {}
          showToast();
          setTimeout(()=>{ window.location.replace(`/result/${session}`); }, 1200);
        }
      } catch {}
    };
    poll();
    intId = setInterval(poll, 2000);
  })();
  </script>
{% endblock %}
